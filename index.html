function mk(o){const u=Object.assign({id:uid++,x:0,y:0,hp:1,atk:10,armor:0,range:60,cd:0,acd:1,speed:100,r:14,team:0,type:'minion',target:null,dead:false,wp:1,stun:0,slowT:0,mp:1,maxmp:1,gold:0,xp:0},o);u.maxhp=o.maxhp||o.hp;u.hp=u.maxhp;units.push(u);return u}
function laneLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function laneAt(p,t){let d=t*laneLen(p);for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l){const k=d/l;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}d-=l}return p[p.length-1]}
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=clamp(t,0,1);return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}

/* ---------- HEROES ---------- */
function recalc(h){const b=h.base,l=h.lvl-1;const a={hp:0,mp:0,atk:0,armor:0,speed:0,ap:0,ls:0,cdr:0};
 h.items.forEach(i=>{for(const k in i.s)a[k]+=i.s[k]});
 h.maxhp=b.hp+b.hpg*l+a.hp;h.maxmp=b.mp+b.mpg*l+a.mp;h.atk=b.atk+b.atkg*l+a.atk;h.armor=b.armor+2*l+a.armor;
 h.speed=b.speed+a.speed;h.ap=a.ap;h.ls=a.ls;h.cdr=Math.min(.4,a.cdr);h.hp=Math.min(h.hp,h.maxhp);h.mp=Math.min(h.mp,h.maxmp)}
function mkHero(key,team,isPlayer,lane){const d=HEROES[key],b=BASE[team];
 const h=mk({type:'hero',team,key,e:d.e,c:d.c,name:d.n,x:b.x+rand(-90,90),y:b.y+rand(-90,90),hp:1,r:20,range:d.range,acd:d.acd,
  base:{hp:d.hp,hpg:d.hpg,mp:d.mp,mpg:d.mpg,atk:d.atk,atkg:d.atkg,armor:d.armor,speed:d.speed},skills:d.sk,lvl:1,xp:0,gold:isPlayer?600:500,items:[],
  cds:[0,0,0,0],player:isPlayer,lane,path:team?LANES[lane].slice().reverse():LANES[lane],wp:1,kills:0,deaths:0,respawn:0,ls:0,ap:0,cdr:0,think:0,nextBuy:0,recall:false});
 recalc(h);h.hp=h.maxhp;h.mp=h.maxmp;return h}
const xpNeed=l=>100+l*70;
function gainXp(h,a){h.xp+=a;while(h.lvl<15&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;const oh=h.hp,om=h.mp;recalc(h);h.hp=Math.min(h.maxhp,oh+h.base.hpg);h.mp=Math.min(h.maxmp,om+h.base.mpg);fx.push({k:'ring',x:h.x,y:h.y,r:70,t:.6,T:.6,c:'#ffd400'});if(h===player)msg('LEVEL UP! Lv'+h.lvl)}}
function xpShare(x,y,team,amt){const hs=units.filter(u=>u.type=='hero'&&u.team==team&&!u.dead&&Math.hypot(u.x-x,u.y-y)<800);hs.forEach(h=>gainXp(h,amt*1.2/hs.length))}

/* ---------- COMBAT ---------- */

const near=(a,b,r)=>dist(a,b)<r;
const towersAlive=t=>units.filter(u=>u.type=='tower'&&u.team==t&&!u.dead).length;
function heal(u,a){u.hp=Math.min(u.maxhp,u.hp+a)}
function cc(e,s){if(s.slow)e.slowT=Math.max(e.slowT,time+s.slow);if(s.stun&&!e.static)e.stun=Math.max(e.stun,time+s.stun)}
function hurt(src,u,d,magic){if(u.dead)return;
 if(u.type=='base'&&towersAlive(u.team)>3){if(src===player)msg('Nexus protected! Sirain muna ang 3 towers');return}
 d*=100/(100+(magic?u.armor*.5:u.armor));u.hp-=d;
 if(src.ls&&!magic)heal(src,d*src.ls);
 if(u.type=='neutral'&&!u.target)u.target=src;
 if(src===player||u===player)fx.push({k:'txt',x:u.x+rand(-10,10),y:u.y-25,t:.7,T:.7,s:Math.round(d),c:u===player?'#f55':'#fff'});
 if(u.hp<=0)kill(u,src)}
function kill(u,src){u.dead=true;u.target=null;const rt=src.team;
 if(u.type=='hero'){u.deaths++;u.respawn=time+5+u.lvl*2;if(rt<2)kills[rt]++;if(src.type=='hero'){src.kills++;src.gold+=300}xpShare(u.x,u.y,rt,120+u.lvl*20);
  if(u===player)msg('Natalo ka! Respawn in '+Math.round(5+u.lvl*2)+'s')}
 else if(u.type=='tower'){units.filter(h=>h.type=='hero'&&h.team==rt).forEach(h=>h.gold+=150);msg((u.team?'Enemy':'Your')+' tower destroyed!')}
 else if(u.type=='base'){end(rt)}
 else{if(src.type=='hero')src.gold+=u.gold;xpShare(u.x,u.y,rt,u.xp)}
 if(u.camp)u.camp.respawn=time+45;
 fx.push({k:'ring',x:u.x,y:u.y,r:u.r*1.6,t:.4,T:.4,c:'#fff'})}
